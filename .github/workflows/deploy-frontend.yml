name: Deploy Frontend to Vercel

# Production deploys on push to main via Vercel Git (dashboard).
# This workflow is a manual backup; set repository secrets:
#   VERCEL_TOKEN — paste token value; secret name on GitHub must be VERCEL_TOKEN
#     (create while logged into the correct Vercel account: vercel.com/account/tokens)
#   VERCEL_ORG_ID / VERCEL_PROJECT_ID — from `vercel link` then `.vercel/project.json`
#   blaze308 team (current linked project): team_gdUTLxCXISAkzmENz9X817A9, prj_0EyVByiCw1RKJJqiQAIk0FkEpIZK
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=
          [ -z "$VERCEL_TOKEN" ] && missing="${missing} VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="${missing} VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="${missing} VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "Create a token at https://vercel.com/account/tokens"
            echo "Find org/project IDs with: vercel link && cat .vercel/project.json"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
